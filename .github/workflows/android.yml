name: Android app

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to publish releases
    defaults:
      run:
        working-directory: android
    env:
      VERSION_CODE: ${{ github.run_number }}
      # Signed builds need the four SIGNING_* repository secrets (see README).
      HAS_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        if: env.HAS_KEY == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$SIGNING_KEYSTORE_PATH"
          ./gradlew assembleRelease
          rm -f "$SIGNING_KEYSTORE_PATH"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/have-i-read-that-1.0.$VERSION_CODE.apk"

      - name: Build debug APK (no signing key configured)
        if: env.HAS_KEY != 'true'
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/have-i-read-that-1.0.$VERSION_CODE.apk"

      - name: Show signing certificate
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          {
            echo "### Have I read that? 1.0.$VERSION_CODE"
            if [ "$HAS_KEY" = "true" ]; then echo "Ondertekend met de eigen sleutel:"; else echo "Testversie (debug-sleutel, kan niet over een eerdere versie heen):"; fi
            echo '```'
            "$apksigner" verify --print-certs "$RUNNER_TEMP/have-i-read-that-1.0.$VERSION_CODE.apk" | grep -E 'DN|SHA-256'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: have-i-read-that-apk
          path: ${{ runner.temp }}/have-i-read-that-1.0.${{ github.run_number }}.apk

      - name: Publish GitHub release
        if: env.HAS_KEY == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.$VERSION_CODE" "$RUNNER_TEMP/have-i-read-that-1.0.$VERSION_CODE.apk" \
            --title "Have I read that? 1.0.$VERSION_CODE" \
            --notes "Android-app, build $VERSION_CODE. Installeer de APK over de vorige versie heen."
