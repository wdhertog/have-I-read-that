{% extends "base.html" %}
{% block title %}Inloggen{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>📚 Have I read that?</h1>
  {% if not configured %}
    <p class="flash error">Er is nog geen wachtwoord ingesteld. Zet de omgevingsvariabele <code>APP_PASSWORD</code> en herstart de app.</p>
  {% endif %}
  <form method="post">
    <label>Wachtwoord <input type="password" name="password" autofocus required></label>
    <button>Inloggen</button>
  </form>
</section>
{% endblock %}
