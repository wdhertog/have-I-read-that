<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Boeken{% endblock %} · Have I read that?</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if session.logged_in %}
  <header class="top">
    <a class="brand" href="{{ url_for('main.index') }}">📚 Have I read that?</a>
    <nav>
      <a href="{{ url_for('main.index') }}">Boeken</a>
      <a href="{{ url_for('main.add') }}">+ Toevoegen</a>
      <a href="{{ url_for('main.stats') }}">Statistieken</a>
      <a href="{{ url_for('main.import_storygraph') }}">Import</a>
      <a href="{{ url_for('main.settings') }}">Mastodon</a>
      <form method="post" action="{{ url_for('main.logout') }}" class="inline"><button class="link">Uitloggen</button></form>
    </nav>
  </header>
  {% endif %}
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
