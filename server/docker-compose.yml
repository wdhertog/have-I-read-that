# Usage (in server/): cp .env.example .env, edit it, then `docker compose up -d --build`.
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"   # put a reverse proxy with HTTPS in front of this
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      - db

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-books}
      MARIADB_USER: ${DB_USER:-books}
      MARIADB_PASSWORD: ${DB_PASSWORD:?zet DB_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql

volumes:
  db:
